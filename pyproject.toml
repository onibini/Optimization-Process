[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wec-optimization"
version = "0.1.0"
description = "Shape and layout optimization tools for wave energy converter arrays"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AMHL" }]
dependencies = [
    "numpy",
    "scipy",
    "gmsh",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest>=7",
    "ruff>=0.16",
]

[project.scripts]
wec-optimize = "wec_optimization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wec_optimization = ["data/*.csv"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "PERF", "RUF"]
ignore = ["SIM115"]
