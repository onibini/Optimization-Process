# ==========================================
# WEC Optimization Configuration File
# ==========================================

[Simulation]
1     OptMode       - [Switch] Optimization mode {1: Geometry, 2: Layout, 3: Both}
1     Algorithm     - [Switch] Optimization algorithm {1: Differential Evolution, 2: Particle Swarm Optimization, 3: Genetic Algorithm, 4: CMA-ES, 5: DEPSO}
1     WaveSpec      - [Switch] Wave spectrum type {1: JONSWAP (ITTC), 2: JONSWAP (Goda, Hs about 4% high), 3: Pierson-Moskowitz}
# 수력 해석기 (선택, 기본 1). 1: WAMIT (상용, 수직벽 지원), 2: Capytaine (오픈소스, pip install capytaine, 개방 해역만),
# 3: HydroBEM (hydrobem_gui wheel, Windows x64 + AVX2, Python 3.11+, 수직벽 지원, 입사각 0만). 3은 평가 하나가 NCPU개 스레드를 모두 씁니다.
# 이 파일은 3을 씁니다(NCPU = 계산용 PC의 논리 코어 수, Workers 1). hydrobem_gui가 없으면 1로 바꾸세요.
3     HydroSolver   - [Switch] Hydrodynamic solver {1: WAMIT, 2: Capytaine (open sea only), 3: HydroBEM}
# HydroBEM 고차 (선택, 기본 0). 0: 저차(MeshPanels의 평면 패널). N > 0: B-스플라인 패치(1/4 모델), HydroSolver 3만.
# Shape 2: 엔진의 정확한 원통, 옆면 N x N, 바닥 N x N/2. 2면 저차 120보다 빠르고 정확했습니다.
# Shape 1: cad2bem으로 만든 반구 패치 3개(data/hemisphere_patches.json, 반지름 0.5~2.5 m, 0.1 간격) + 원통 패치, 모두 N x N.
# 1이 2와 0.06% 이내로 같고 약 13배 빠릅니다. 12 이상은 메모리가 크게 듭니다.
0     HighOrderSpans - [Integer >= 0] HydroBEM higher-order spans per patch edge {0: low order (MeshPanels)}
# PTO 감쇠 규칙 (선택, 기본 1). 1: WEC마다 고유주파수 w_n(w^2 (m + A_kk(w)) = K_kk의 해)의 방사감쇠 B_kk.
# 2: PTO 없는 RAO가 가장 큰 격자점의 B_kk (2026-11 이전 결과 재현용). 규칙이 다른 평가 기록은 서로 섞이지 않습니다.
1     PTORule       - [Switch] PTO damping {1: B_kk at the natural frequency, 2: B_kk at the uncontrolled RAO peak (legacy)}
[WEC Parameters]
1     NumWECs       - [Switch] Number of WECs in the optimization {1: Single WEC, 3: Three WECs, 5: Five WECs}
# WEC 형상 (선택, 기본 1). 1: 원통 + 반구 바닥 (Draft = 원통부 길이, 총 흘수 = Draft + Radius),
# 2: 평평한 바닥 원통 (Draft = 총 흘수). 두 형상 모두 설계 변수는 Radius와 Draft입니다.
1     Shape         - [Switch] WEC shape {1: cylinder + hemisphere, 2: cylinder with flat bottom}
# 수직벽 (선택, 기본 1). 1: 배치·동시 최적화(OptMode 2, 3)에서 x = 0에 수직벽, 0: 개방 해역. OptMode 1은 항상 개방 해역.
1     VerticalWall  - [Switch] Vertical wall at x = 0 in OptMode 2 and 3 {0: open sea, 1: wall}
# 입사파 방향 (선택, 기본 0, 단위 도). 파도가 바다 쪽(x > 0)에서 벽으로 다가오는 방향과 벽의 법선(x 축) 사이 각도입니다.
# 0: 벽에 수직으로 다가옴, 양수: +y 쪽에서 비스듬히 다가옴. -90 < 값 < 90. 벽이 없는 배치(VerticalWall 0)는 0만 됩니다.
# WAMIT에는 BETA = -WaveAngle로 들어갑니다(벽 반사를 포함하면 실제 진행 방향 180 + WaveAngle과 같은 파동장).
# 배치는 y = 0에 대칭이므로 +a와 -a의 총 파워는 같고, 쌍을 이룬 WEC(2와 3, 4와 5)의 파워만 서로 바뀝니다.
0     WaveAngle     - [Float, -90 < deg < 90] Incident wave direction from the wall normal (0: head-on to the wall)
4     MinSpacing    - [Float > 0] Minimum distance between WECs (only used if OptMode is 2 or 3)
2.5   FixedRadius   - [Float > 0] Fixed radius for WECs (only used if OptMode is 2)
5.0   FixedDraft    - [Float > 0] Fixed draft for WECs (only used if OptMode is 2)

[AlgorithmSettings]
30   PopSize       - [Integer] Population size for the optimization algorithm
300   MaxIter       - [Integer] Maximum number of iterations for the optimization algorithm
0.5   F             - [Float] Mutation factor for Differential Evolution (used if Algorithm is 1 or 5)
0.9   CR            - [Float] Crossover rate for Differential Evolution (used if Algorithm is 1 or 5)
# DE 교체 방식 (선택, 기본 0). 0: 즉시 교체(논문), 1: 세대 단위(세대 전체를 함께 평가),
# 2: 묶음 즉시 교체(Workers개씩 함께 평가하고 바로 교체, Workers = 1이면 0과 같음). WAMIT을 여러 개 돌리려면 2를 권장.
0     DEUpdate      - [Switch] DE replacement {0: immediate (paper), 1: generation-wise, 2: immediate in blocks of Workers}
# 난수 시드 (선택, 기본 -1). -1이면 실행마다 새로 뽑아 로그(*_config.json, *_summary.json)에 남깁니다.
# 같은 시드, 같은 설정이면 같은 설계들을 평가합니다. WAMIT 값의 끝자리 차이로 경로가 갈릴 수는 있습니다.
-1    Seed          - [Integer] Random seed {-1: draw a new one and record it}
# 아래는 DE(Algorithm 1) 전용이며, 기본값은 모두 논문과 같은 동작입니다.
# 변이 전략 (선택, 기본 0). 0: a + F(b - c), 1: x_i + F(best - x_i) + F(b - c)
0     DEStrategy    - [Switch] DE mutation {0: rand/1 (paper), 1: current-to-best/1}
# 수렴 처리 (선택, 기본 0). StallGens 세대 동안 새 설계가 하나도 나오지 않으면 StallAction을 합니다. 0이면 MaxIter까지 돌립니다.
0     StallGens     - [Integer >= 0] Generations without any new design before StallAction {0: off}
0     StallAction   - [Switch] When converged {0: stop, 1: keep the best individual and redraw the others}
# 지역 탐색 (선택, 기본 0). 끝난 뒤 최고 설계의 변수를 하나씩 옮겨 봅니다. 값은 물리 해석 횟수의 상한이며, 0이면 안 합니다.
0     LocalSearchEvals - [Integer >= 0] Maximum evaluations of the final local search {0: off}
# 이어 돌리기 (선택, 기본 0). 끊긴 실행의 logs/*_checkpoint.json 경로를 적습니다(공백 없이). 0이면 처음부터 돌립니다.
# 체크포인트는 DE가 세대마다 저장합니다. 해역, F, CR, DEUpdate, DEStrategy, 범위 등이 달라지면 오류로 멈춥니다.
0     Resume        - [Path] Checkpoint to resume from {0: start a new run}
0.5   w             - [Float] Inertia weight for Particle Swarm Optimization (used if Algorithm is 2 or 5)
1.5   c1            - [Float] Cognitive coefficient for Particle Swarm Optimization (used if Algorithm is 2 or 5)
1.5   c2            - [Float] Social coefficient for Particle Swarm Optimization (used if Algorithm is 2 or 5)
0.1   MutationRate  - [Float] Mutation probability for Genetic Algorithm (only used if Algorithm is 3)
0.3   SigmaInit     - [Float] Initial search step ratio for CMA-ES (only used if Algorithm is 4)

[Constraints]
# 모든 설계 변수(반지름, 흘수, WEC 좌표)의 탐색 범위는 0 < Min < Max 이어야 합니다.
0.1   StepSize      - [Float > 0] Default grid step for every design variable
# 변수별 격자 간격 (선택): 아래 줄의 '#'을 지우고 값을 바꾸면 그 변수만 StepSize 대신 이 값을 사용합니다.
# 키 이름은 '{변수}Step' 형식이며, 간격은 0보다 크고 (Max - Min) 이하여야 합니다.
# (Max - Min)이 간격으로 나누어떨어지지 않으면 실제 탐색 상한이 Max보다 작아지며 경고가 출력됩니다.
# 0.1   RadiusStep    - [Float > 0] Grid step for radius
# 0.1   DraftStep     - [Float > 0] Grid step for draft
# 0.5   WEC1_XStep    - [Float > 0] Grid step for WEC 1 x
# 0.5   WEC2_XStep    - [Float > 0] Grid step for WEC 2 x
# 0.5   WEC2_YStep    - [Float > 0] Grid step for WEC 2 y
# 0.5   WEC3_XStep    - [Float > 0] Grid step for WEC 3 x
# 0.5   WEC3_YStep    - [Float > 0] Grid step for WEC 3 y
0.5   RadiusMin     - [Float > 0] Minimum radius for WEC (only used if OptMode is 1 or 3)
2.5   RadiusMax     - [Float > 0] Maximum radius for WEC (only used if OptMode is 1 or 3)
0.5   DraftMin      - [Float > 0] Minimum draft for WEC (only used if OptMode is 1 or 3)
5.0   DraftMax      - [Float > 0] Maximum draft for WEC (only used if OptMode is 1 or 3)
3.0   WEC1_XMin     - [Float > 0] Minimum X position for WEC 1 (only used if OptMode is 2 or 3)
25.0  WEC1_XMax     - [Float > 0] Maximum X position for WEC 1 (only used if OptMode is 2 or 3)
3.0   WEC2_XMin     - [Float > 0] Minimum X position for WEC 2 (only used if OptMode is 2 or 3 and NumWECs is 3 or 5)
25.0  WEC2_XMax     - [Float > 0] Maximum X position for WEC 2 (only used if OptMode is 2 or 3 and NumWECs is 3 or 5)
0.1   WEC2_YMin     - [Float > 0] Minimum Y position for WEC 2 (only used if OptMode is 2 or 3 and NumWECs is 3 or 5)
30.0  WEC2_YMax     - [Float > 0] Maximum Y position for WEC 2 (only used if OptMode is 2 or 3 and NumWECs is 3 or 5)
3.0   WEC3_XMin     - [Float > 0] Minimum X position for WEC 3 (only used if OptMode is 2 or 3 and NumWECs is 5)
25.0  WEC3_XMax     - [Float > 0] Maximum X position for WEC 3 (only used if OptMode is 2 or 3 and NumWECs is 5)
0.1   WEC3_YMin     - [Float > 0] Minimum Y position for WEC 3 (only used if OptMode is 2 or 3 and NumWECs is 5)
30.0  WEC3_YMax     - [Float > 0] Maximum Y position for WEC 3 (only used if OptMode is 2 or 3 and NumWECs is 5)

[Environment]
3     SiteID        - [Integer] ID of the site for the optimization (must match an entry in env_data.csv)
# 수심 (선택, 기본 0). 0이면 env_data.csv의 값, 양수이면 그 값(m)을 씁니다(예: 논문 영일만항 계산 33).
0     Depth         - [Float >= 0] Water depth in m {0: the env_data.csv value}

[WAMIT Settings]
16    RAMGBMAX      - [Integer] Maximum RAM in GB for WAMIT simulations
8     NCPU          - [Integer] Number of CPU cores to use for WAMIT simulations
# WAMIT 실행 파일 경로 (선택). 지정하지 않으면 환경 변수 WAMIT_EXE, 그것도 없으면 C:\WAMITv7\WAMIT.exe 를 사용합니다.
# 값은 공백 없이 한 토큰이어야 하므로, 경로에 공백이 있으면 환경 변수 WAMIT_EXE를 사용하세요.
# C:\WAMITv7\WAMIT.exe   WAMITPath     - [Path] Full path to WAMIT.exe (no spaces)
# 기당 1/4 모델 패널 수 목표 (선택, 기본 120). 격자 구조상 가장 가까운 값이 쓰입니다.
# 5기 수렴 테스트(160~205패널 결과 대비): 120패널은 대부분의 설계에서 총 파워 0.5% 이내, 개별 WEC 1.2% 이내이고
# 평가 약 12초입니다. 80패널은 가늘고 긴 형상(R 0.5, D 2.0: 총 파워 -11%), 넓고 얕은 형상(R 2.5, D 0.5: +3.6%),
# 촘촘한 배치(R 2.5, D 5.0, 간격 6 m: +2.7%)에서 크게 틀립니다. 가늘고 긴 형상은 120에서도 개별 WEC 5% 정도
# 틀리므로 160 이상을 권장하며(평가 약 20~24초), 1기는 150~250을 권장합니다. 설정 범위의 최악 형상으로
# 직접 확인하는 것이 가장 안전합니다.
# 32-bit WAMIT은 (MeshPanels x NumWECs)가 약 1,100~1,300을 넘으면 메모리 오류가 나고(1,000 초과 시 경고, 넓고 얕은
# 형상은 1/4 패널 224개 x 5기에서 실패), 평가 시간은 패널 수의 약 2.5~3제곱으로 늘어납니다.
120   MeshPanels    - [Integer >= 12] Target number of panels per body (quarter model)
# 선형 시스템 솔버 (WAMIT ISOLVE, 선택, 기본 0). 0: 반복 솔버, 1: 직접 솔버, N>=2: N블록 반복 솔버.
# 반복 솔버는 같은 결과를 더 빠르게 내고(5기 전체 405 패널 1.45배, 1,025 패널 약 2.7배) 메모리도 적게 씁니다.
# 반복이 MAXITT(100)에 도달해 수렴하지 못한 주파수가 있으면 경고하며, 그때는 1(직접)로 바꿔 보세요.
0     Solver        - [Integer >= 0] WAMIT linear solver {0: iterative, 1: direct, N: N-block iterative}
# 주파수 격자 상한 (선택, 기본 3.0 rad/s). 격자는 0.5 rad/s부터 0.05 간격이며 상한이 낮을수록 계산이 빨라집니다.
# 크고 깊은 WEC(예: R=2.5, D=5.0)는 2.0까지 줄여도 파워가 같지만(약 1.7배 빠름), 작고 얕은 WEC(예: R=0.5, D=0.5)는
# 고주파에서 공진하므로 2.45로 줄이면 파워가 24~41% 사라집니다. 탐색 범위에 작은 WEC이 있으면 3.0을 유지하세요.
3.0   OmegaMax      - [Float >= 0.6] Upper limit of the WAMIT frequency grid in rad/s
# 적응형 주파수 격자 (선택, 기본 0). 0: 균일 격자(0.05 간격), 1: 비제어 공진 부근(0.85~1.1 x w0, w0 = sqrt(g/(D+2R/3)))만
# 0.00625 간격으로 촘촘히 하고 1.5 x w0 위는 0.1 간격으로 성기게 합니다. 점 수는 형상마다 다릅니다(51 -> 약 80~200).
# 균일 0.05는 좁은 공진 형상에서 파워를 1~11% 틀리게 계산하지만 1은 0.1% 이내로 맞춥니다(시간 1.5~2.5배).
0     FreqGrid      - [Integer 0 or 1] Frequency grid {0: uniform, 1: adaptive around the heave resonance}
# 동시에 돌리는 WAMIT 수 (선택, 기본 1). 2 이상이면 한 세대를 여러 WAMIT으로 나눠 평가합니다(작업 폴더 workspace/w0, w1, ...).
# NCPU는 WAMIT 하나당 코어 수이므로 Workers x NCPU가 계산용 PC 코어 수를 넘지 않게 맞추세요(예: 2 x 4, 4 x 2).
# 세대 단위 병렬은 GA, CMA-ES, DEUpdate가 1 또는 2인 DE에 적용되고, 다른 알고리즘은 초기 개체군만 병렬로 평가합니다.
1     Workers       - [Integer >= 1] Number of WAMIT runs at the same time
# 평가 기록 재사용 (선택, 기본 0). 1이면 data/eval_db에서 설정(해역·스펙트럼·형상·메쉬·솔버·주파수·벽·입사각)이
# 같은 기록을 불러와, 이미 계산한 설계는 WAMIT 없이 그 값을 씁니다. 기록은 scripts/build_eval_db.py로 만듭니다.
# WAMIT 계산 수와 시간을 비교하는 실험에서는 0으로 두세요.
0     EvalCache     - [Switch] Reuse stored evaluations from data/eval_db {0: off, 1: on}
