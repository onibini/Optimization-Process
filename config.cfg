# ==========================================
# WEC Optimization Configuration File
# ==========================================

[Simulation]
1     OptMode       - [Switch] Optimization mode {1: Geometry, 2: Layout, 3: Both}
1     Algorithm     - [Switch] Optimization algorithm {1: Differential Evolution, 2: Particle Swarm Optimization, 3: Genetic Algorithm, 4: CMA-ES}
2     WaveSpec      - [Switch] Wave spectrum type {1: JONSWAP (ITTC), 2: JONSWAP (Goda)}
[WEC Parameters]
1     NumWECs       - [Switch] Number of WECs in the optimization {1: Single WEC, 3: Three WECs, 5: Five WECs}
4     MinSpacing    - [Float > 0] Minimum distance between WECs (only used if OptMode is 2 or 3)
2.5   FixedRadius   - [Float > 0] Fixed radius for WECs (only used if OptMode is 2)
5.0   FixedDraft    - [Float > 0] Fixed draft for WECs (only used if OptMode is 2)

[AlgorithmSettings]
30   PopSize       - [Integer] Population size for the optimization algorithm
300   MaxIter       - [Integer] Maximum number of iterations for the optimization algorithm
0.5   F             - [Float] Mutation factor for Differential Evolution (only used if Algorithm is 1)
0.9   CR            - [Float] Crossover rate for Differential Evolution (only used if Algorithm is 1)
0.5   w             - [Float] Inertia weight for Particle Swarm Optimization (only used if Algorithm is 2)
1.5   c1            - [Float] Cognitive coefficient for Particle Swarm Optimization (only used if Algorithm is 2)
1.5   c2            - [Float] Social coefficient for Particle Swarm Optimization (only used if Algorithm is 2)
0.1   MutationRate  - [Float] Mutation probability for Genetic Algorithm (only used if Algorithm is 3)
0.3   SigmaInit     - [Float] Initial search step ratio for CMA-ES (only used if Algorithm is 4)

[Constraints]
# 모든 설계 변수(반지름, 흘수, WEC 좌표)의 탐색 범위는 0 < Min < Max 이어야 합니다.
0.1   StepSize      - [Float > 0] Default grid step for every design variable
# 변수별 격자 간격 (선택): 아래 줄의 '#'을 지우고 값을 바꾸면 그 변수만 StepSize 대신 이 값을 사용합니다.
# 키 이름은 '{변수}Step' 형식이며, 간격은 0보다 크고 (Max - Min) 이하여야 합니다.
# (Max - Min)이 간격으로 나누어떨어지지 않으면 실제 탐색 상한이 Max보다 작아지며 경고가 출력됩니다.
# 0.1   RadiusStep    - [Float > 0] Grid step for radius
# 0.1   DraftStep     - [Float > 0] Grid step for draft
# 0.5   WEC1_XStep    - [Float > 0] Grid step for WEC 1 x
# 0.5   WEC2_XStep    - [Float > 0] Grid step for WEC 2 x
# 0.5   WEC2_YStep    - [Float > 0] Grid step for WEC 2 y
# 0.5   WEC3_XStep    - [Float > 0] Grid step for WEC 3 x
# 0.5   WEC3_YStep    - [Float > 0] Grid step for WEC 3 y
0.5   RadiusMin     - [Float > 0] Minimum radius for WEC (only used if OptMode is 1 or 3)
2.5   RadiusMax     - [Float > 0] Maximum radius for WEC (only used if OptMode is 1 or 3)
0.5   DraftMin      - [Float > 0] Minimum draft for WEC (only used if OptMode is 1 or 3)
5.0   DraftMax      - [Float > 0] Maximum draft for WEC (only used if OptMode is 1 or 3)
3.0   WEC1_XMin     - [Float > 0] Minimum X position for WEC 1 (only used if OptMode is 2 or 3)
25.0  WEC1_XMax     - [Float > 0] Maximum X position for WEC 1 (only used if OptMode is 2 or 3)
3.0   WEC2_XMin     - [Float > 0] Minimum X position for WEC 2 (only used if OptMode is 2 or 3 and NumWECs is 3 or 5)
25.0  WEC2_XMax     - [Float > 0] Maximum X position for WEC 2 (only used if OptMode is 2 or 3 and NumWECs is 3 or 5)
0.1   WEC2_YMin     - [Float > 0] Minimum Y position for WEC 2 (only used if OptMode is 2 or 3 and NumWECs is 3 or 5)
30.0  WEC2_YMax     - [Float > 0] Maximum Y position for WEC 2 (only used if OptMode is 2 or 3 and NumWECs is 3 or 5)
3.0   WEC3_XMin     - [Float > 0] Minimum X position for WEC 3 (only used if OptMode is 2 or 3 and NumWECs is 5)
25.0  WEC3_XMax     - [Float > 0] Maximum X position for WEC 3 (only used if OptMode is 2 or 3 and NumWECs is 5)
0.1   WEC3_YMin     - [Float > 0] Minimum Y position for WEC 3 (only used if OptMode is 2 or 3 and NumWECs is 5)
30.0  WEC3_YMax     - [Float > 0] Maximum Y position for WEC 3 (only used if OptMode is 2 or 3 and NumWECs is 5)

[Environment]
3     SiteID        - [Integer] ID of the site for the optimization (must match an entry in env_data.csv)

[WAMIT Settings]
16    RAMGBMAX      - [Integer] Maximum RAM in GB for WAMIT simulations
8     NCPU          - [Integer] Number of CPU cores to use for WAMIT simulations
# WAMIT 실행 파일 경로 (선택). 지정하지 않으면 환경 변수 WAMIT_EXE, 그것도 없으면 C:\WAMITv7\WAMIT.exe 를 사용합니다.
# 값은 공백 없이 한 토큰이어야 하므로, 경로에 공백이 있으면 환경 변수 WAMIT_EXE를 사용하세요.
# C:\WAMITv7\WAMIT.exe   WAMITPath     - [Path] Full path to WAMIT.exe (no spaces)
